[package]
name = "xmip-core-identify-ip"
version.workspace = true
edition.workspace = true
license.workspace = true
repository = "https://github.com/IlleNilsson/xmip-core-identify-ip"
description = "Identify by ip: the peer address, read behind a trusted proxy from the one header that proxy writes; a transport-layer claim, passed. A xmip-core-identify technology."
publish.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
# A Technology depends on its parent Capability, never the reverse
# (repository-model.md): the identifier trait, the arrival and the claim live
# there. The mechanism it reads is declared once in xmip-core (ADR-0050).
identify = { workspace = true }
# The names the transport writes on the arrival (context::property).
context = { workspace = true }
xcore = { workspace = true }
# The peer's address and the network a trusted proxy is written as.
net = { workspace = true }

[lints]
workspace = true
